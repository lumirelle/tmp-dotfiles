# 1. Disguise as Kitty, deceive Snacks.nvim.
# Rio currently supports Kitty Graphic Protocol, but does not being added to the terminal whitelist of Snacks.nvim.
# 2. Set TERM to fit the prerequisite of TUIOS.
env-vars = ["TERM=xterm-256color", "SNACKS_KITTY=true", "WSLENV=TERM_PROGRAM:TERM_PROGRAM_VERSION:COLORTERM:TERM:SNACKS_KITTY"]

[cursor]
blinking = true

[effect]
trail-cursor = true

[fonts]
family = "GeistMono Nerd Font"
size = 16
# Unicode ranges are hex; `end` is exclusive.
symbol-map = [
  { start = "3000", end = "3040", font-family = "Maple Mono CN" }, # CJK punctuation
  { start = "3400", end = "4DC0", font-family = "Maple Mono CN" }, # CJK Ext A
  { start = "4E00", end = "A000", font-family = "Maple Mono CN" }, # CJK Unified Ideographs
  { start = "F900", end = "FB00", font-family = "Maple Mono CN" }, # CJK Compatibility Ideographs
]

[shell]
program = "nu"
args = ["--login"]

[window]
width = 1200
height = 800
blur = true
